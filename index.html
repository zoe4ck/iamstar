<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAR DRESS UP</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:'Noto Sans KR',sans-serif;
    background:
        radial-gradient(circle at 20% 20%,rgba(255,255,255,.9) 0 2px,transparent 3px),
        radial-gradient(circle at 80% 15%,rgba(255,255,255,.8) 0 2px,transparent 3px),
        radial-gradient(circle at 70% 70%,rgba(255,255,255,.65) 0 1.5px,transparent 3px),
        linear-gradient(135deg,#ffe9f5,#e8e6ff 45%,#dff6ff);
    background-size:180px 180px,220px 220px,150px 150px,100% 100%;
    color:#55436e;
}

button{
    font-family:inherit;
}

.screen{
    display:none;
    min-height:100vh;
}

.screen.active{
    display:flex;
}

/* =========================
   START
========================= */

#startScreen{
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

.startDecor{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.star{
    position:absolute;
    color:#fff;
    font-size:28px;
    animation:floatStar 3s ease-in-out infinite;
    text-shadow:0 0 12px #fff;
}

.star:nth-child(1){left:12%;top:18%;}
.star:nth-child(2){right:15%;top:25%;font-size:20px;animation-delay:.5s;}
.star:nth-child(3){left:20%;bottom:22%;font-size:18px;animation-delay:1s;}
.star:nth-child(4){right:23%;bottom:18%;font-size:30px;animation-delay:1.5s;}

@keyframes floatStar{
    0%,100%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-12px) scale(1.12);}
}

.startBox{
    width:min(720px,90%);
    padding:65px 35px 55px;
    text-align:center;
    background:rgba(255,255,255,.75);
    border:3px solid white;
    border-radius:42px;
    box-shadow:
        0 25px 70px rgba(123,91,157,.18),
        inset 0 0 40px rgba(255,255,255,.8);
    backdrop-filter:blur(12px);
    position:relative;
}

.logoSmall{
    font-family:'Baloo 2',sans-serif;
    color:#c69adf;
    letter-spacing:6px;
    font-size:18px;
    font-weight:700;
}

.logo{
    margin:4px 0 5px;
    font-family:'Baloo 2',sans-serif;
    font-size:72px;
    line-height:1;
    font-weight:700;
    background:linear-gradient(90deg,#ff9bc7,#a990ed,#72c9ee);
    -webkit-background-clip:text;
    color:transparent;
    filter:drop-shadow(0 4px 3px rgba(130,90,170,.12));
}

.logoSub{
    color:#8b769d;
    font-size:15px;
    letter-spacing:4px;
}

.startButton{
    margin-top:45px;
    width:230px;
    padding:17px 30px;
    border:0;
    border-radius:999px;
    background:linear-gradient(90deg,#ff9fca,#b9a1f4,#8bd7ed);
    color:white;
    font-size:19px;
    font-weight:900;
    letter-spacing:3px;
    cursor:pointer;
    box-shadow:0 10px 25px rgba(167,120,204,.3);
    transition:.25s;
}

.startButton:hover{
    transform:translateY(-4px) scale(1.03);
}

/* =========================
   COMMON
========================= */

.page{
    width:min(1250px,95%);
    margin:auto;
    padding:25px 0 45px;
}

.topTitle{
    text-align:center;
    margin-bottom:25px;
}

.topTitle h1{
    margin:0;
    color:#8e68ae;
    font-family:'Baloo 2',sans-serif;
    font-size:34px;
}

.topTitle p{
    margin:3px 0 0;
    color:#a18cac;
    font-size:13px;
}

.nextButton{
    border:0;
    border-radius:999px;
    padding:14px 35px;
    color:white;
    background:linear-gradient(90deg,#f6a2ca,#b99aed);
    font-weight:900;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(150,110,190,.2);
}

.nextButton:disabled{
    opacity:.35;
    cursor:not-allowed;
}

/* =========================
   CUSTOMIZE
========================= */

.customLayout{
    display:grid;
    grid-template-columns:250px 1fr 250px;
    gap:20px;
    align-items:start;
}

.optionPanel{
    background:rgba(255,255,255,.78);
    border:2px solid white;
    border-radius:25px;
    padding:17px;
    box-shadow:0 12px 35px rgba(120,90,150,.1);
}

.optionTitle{
    color:#9974b3;
    font-weight:900;
    margin-bottom:10px;
}

.optionGroup{
    margin-bottom:20px;
}

.optionGroup label{
    display:block;
    color:#a28daa;
    font-size:12px;
    font-weight:700;
    margin-bottom:7px;
}

.optionGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
}

.opt{
    border:2px solid transparent;
    background:#fff;
    border-radius:13px;
    padding:5px 3px;
    cursor:pointer;
    color:#6f5b7e;
    font-size:11px;
    min-height:47px;
    transition:.2s;
}

.opt:hover{
    transform:translateY(-2px);
}

.opt.selected{
    border-color:#dc9ac8;
    background:#fff1f8;
    box-shadow:0 4px 10px rgba(200,130,180,.15);
}

.characterArea{
    min-height:720px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
}

.characterStage{
    width:430px;
    height:690px;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.characterSVG{
    width:430px;
    height:690px;
    overflow:visible;
}

.previewLabel{
    margin-top:-5px;
    color:#a38aac;
    font-size:12px;
}

/* =========================
   SVG
========================= */

.skin{
    fill:#f8d5c1;
    stroke:#4e3b4e;
    stroke-width:2.5;
    stroke-linejoin:round;
}

.bodyLine{
    fill:#f8d5c1;
    stroke:#4e3b4e;
    stroke-width:2.5;
    stroke-linejoin:round;
    stroke-linecap:round;
}

.face{
    fill:#f8d5c1;
    stroke:#4e3b4e;
    stroke-width:2.6;
}

.hair{
    fill:#473345;
    stroke:#39293c;
    stroke-width:2.8;
    stroke-linejoin:round;
}

.hairLight{
    fill:none;
    stroke:#806077;
    stroke-width:2;
    opacity:.6;
    stroke-linecap:round;
}

.eyeWhite{
    fill:white;
}

.eyeLine{
    fill:none;
    stroke:#39283d;
    stroke-width:4;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.eyeDetail{
    fill:#5a365f;
}

.eyeHighlight{
    fill:white;
}

.brow{
    fill:none;
    stroke:#553848;
    stroke-width:4;
    stroke-linecap:round;
}

    fill:#39283d;
    d:path("M226 177

/* iris */

.iris{
    fill:#8b5e99;
    stroke:#39283d;
    stroke-width:2;
}

.pupil{
    fill:#35253b;
}

.highlight{
    fill:white;
}

/* eyelashes */

.lash{
    fill:none;
    stroke:#39283d;
    stroke-width:3;
    stroke-linecap:round;
}

/* =========================
   BODY
========================= */

.bodyBase{
    fill:#f8d5c1;
    stroke:#4e3b4e;
    stroke-width:2.5;
}

.bodyTop{
    fill:#fff;
    stroke:#4e3b4e;
    stroke-width:2.5;
}

.bodyBottom{
    fill:#fff;
    stroke:#4e3b4e;
    stroke-width:2.5;
}

/* =========================
   OPTION MINI PREVIEWS
========================= */

.miniFace{
    width:40px;
    height:38px;
}

.miniHair{
    width:45px;
    height:40px;
}

.miniEye{
    width:45px;
    height:30px;
}

/* =========================
   CARD PAGE
========================= */

.cardPage{
    width:min(1200px,95%);
    margin:auto;
    padding:25px 0 45px;
}

.cardCategories{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.categoryBtn{
    border:2px solid white;
    background:rgba(255,255,255,.75);
    color:#876d9a;
    padding:9px 18px;
    border-radius:999px;
    cursor:pointer;
    font-weight:700;
}

.categoryBtn.active{
    background:#eab0d2;
    color:white;
}

.cardGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:15px;
}

.fashionCard{
    background:rgba(255,255,255,.88);
    border:3px solid transparent;
    border-radius:22px;
    padding:12px;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 8px 25px rgba(120,90,150,.1);
}

.fashionCard:hover{
    transform:translateY(-5px);
}

.fashionCard.selected{
    border-color:#df91bf;
    box-shadow:0 0 0 4px rgba(223,145,191,.12);
}

.cardVisual{
    height:180px;
    border-radius:15px;
    background:linear-gradient(145deg,#fff2fa,#edf1ff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:70px;
}

.cardName{
    font-weight:900;
    color:#71547e;
    margin-top:10px;
}

.cardType{
    color:#ae91b7;
    font-size:11px;
}

/* =========================
   MACHINE
========================= */

.machineLayout{
    display:grid;
    grid-template-columns:1fr 420px;
    gap:25px;
    align-items:start;
}

.selectedDeck{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.selectedCard{
    background:white;
    border-radius:18px;
    padding:12px;
    box-shadow:0 8px 25px rgba(120,90,150,.1);
    cursor:grab;
    touch-action:none;
}

.selectedCard.dragging{
    position:fixed;
    z-index:1000;
    width:150px;
    pointer-events:none;
    transform:rotate(4deg) scale(1.05);
    box-shadow:0 15px 35px rgba(100,70,120,.25);
}

.slotMachine{
    padding:25px;
    border-radius:30px;
    background:linear-gradient(145deg,#fff,#f5eaff);
    border:4px solid #e2c8ee;
    box-shadow:0 15px 45px rgba(120,90,150,.18);
}

.slot{
    height:100px;
    margin:10px 0;
    border:3px dashed #d4b9df;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#b59bc0;
    background:rgba(255,255,255,.5);
    transition:.2s;
}

.slot.hover{
    background:#fff1fa;
    border-color:#e59bc7;
}

.slot.filled{
    border-style:solid;
    border-color:#dba2cb;
    color:#76587f;
}

/* =========================
   TRANSFORMATION
========================= */

#transformOverlay{
    position:fixed;
    inset:0;
    z-index:9999;
    display:none;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle,#fff 0%,rgba(255,230,250,.95) 18%,rgba(170,143,225,.9) 55%,rgba(88,66,135,.98) 100%);
}

#transformOverlay.show{
    display:flex;
    animation:magicIn .5s ease forwards;
}

.magicCircle{
    width:350px;
    height:350px;
    border:4px solid rgba(255,255,255,.9);
    border-radius:50%;
    box-shadow:
        0 0 30px white,
        0 0 80px #ffc9ed,
        inset 0 0 40px white;
    animation:spinMagic 1.8s linear infinite;
}

.magicText{
    position:absolute;
    color:white;
    font-family:'Baloo 2',sans-serif;
    font-size:34px;
    font-weight:700;
    letter-spacing:5px;
}

@keyframes spinMagic{
    to{transform:rotate(360deg);}
}

@keyframes magicIn{
    from{opacity:0;}
    to{opacity:1;}
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){
    .customLayout{
        grid-template-columns:1fr;
    }

    .optionPanel{
        order:2;
    }

    .characterArea{
        order:1;
    }

    .machineLayout{
        grid-template-columns:1fr;
    }
}

@media(max-width:500px){
    .logo{
        font-size:52px;
    }

    .characterStage,
    .characterSVG{
        width:340px;
        height:600px;
    }
}
</style>
</head>

            <div

                data-type="shoes">
                SHOES
            </div>

            <div
                class="slot"
                data-type="accessory">
                ACCESSORY

                id="transformButton"

<script>

/* =========================
STATE
========================= */

const state = {

    face:'egg',

    eyes:'round',

    brow:'straight',

    bang:'full',

    backHair:'wave'

};

const selectedCards = {

    top:null,

    bottom:null,

    shoes:null,

    accessory:null

};


/* =========================
SCREEN
========================= */

function showScreen(id){

    document.querySelectorAll('.screen')
        .forEach(el=>{
            el.classList.remove('active');
        });

    document.getElementById(id)
        .classList.add('active');

}


/* =========================
START
========================= */

function openCustomize(){

    showScreen('customizeScreen');

}


/* =========================
FACE
========================= */

function setFace(type,button){

    state.face=type;

    document.querySelectorAll(
        '.optionGroup:nth-child(2) .opt'
    );

    document.querySelectorAll('.opt')
        .forEach(x=>{
            if(x.parentElement===button.parentElement){
                x.classList.remove('selected');
            }
        });

    button.classList.add('selected');

    const face=document.getElementById('faceShape');

    if(type==='egg'){

        face.setAttribute(
            'd',
            `M215 82
            C166 82 139 119 139 177
            C139 235 166 283 215 295
            C264 283 291 235 291 177
            C291 119 264 82 215 82 Z`
        );

    }

    if(type==='round'){

        face.setAttribute(
            'd',
            `M215 88
            C164 88 135 123 135 183
            C135 241 168 286 215 286
            C262 286 295 241 295 183
            C295 123 266 88 215 88 Z`
        );

    }

    if(type==='heart'){

        face.setAttribute(
            'd',
            `M215 291
            C194 279 153 252 145 207
            C136 157 157 113 188 106
            C201 103 210 110 215 121
            C220 110 229 103 242 106
            C273 113 294 157 285 207
            C277 252 236 279 215 291 Z`
        );

    }

}


/* =========================
EYES
========================= */

function setEyes(type,button){

    state.eyes=type;

    button.parentElement
        .querySelectorAll('.opt')
        .forEach(x=>x.classList.remove('selected'));

    button.classList.add('selected');

    document.getElementById('eyesRound')
        .style.display =
        type==='round' ? '' : 'none';

    document.getElementById('eyesUp')
        .style.display =
        type==='up' ? '' : 'none';

    document.getElementById('eyesCrescent')
        .style.display =
        type==='crescent' ? '' : 'none';

}


/* =========================
BROW
========================= */

function setBrow(type,button){

    state.brow=type;

    button.parentElement
        .querySelectorAll('.opt')
        .forEach(x=>x.classList.remove('selected'));

    button.classList.add('selected');

    document.getElementById('browStraight')
        .style.display =
        type==='straight' ? '' : 'none';

    document.getElementById('browRound')
        .style.display =
        type==='round' ? '' : 'none';

    document.getElementById('browUp')
        .style.display =
        type==='up' ? '' : 'none';

}


/* =========================
BANG
========================= */

function setBang(type,button){

    state.bang=type;

    button.parentElement
        .querySelectorAll('.opt')
        .forEach(x=>x.classList.remove('selected'));

    button.classList.add('selected');

    document.getElementById('bangFullGroup')
        .style.display =
        type==='full' ? '' : 'none';

    document.getElementById('bangSeeGroup')
        .style.display =
        type==='see' ? '' : 'none';

    document.getElementById('bangSideGroup')
        .style.display =
        type==='side' ? '' : 'none';

}


/* =========================
BACK HAIR
========================= */

function setBackHair(type,button){

    state.backHair=type;

    button.parentElement
        .querySelectorAll('.opt')
        .forEach(x=>x.classList.remove('selected'));

    button.classList.add('selected');

    document.getElementById('backWaveGroup')
        .style.display =
        type==='wave' ? '' : 'none';

    document.getElementById('backBobGroup')
        .style.display =
        type==='bob' ? '' : 'none';

}


/* =========================
CARDS
========================= */

const cards=[

    {
        id:1,
        type:'top',
        name:'Twinkle Blouse',
        emoji:'🎀'
    },

    {
        id:2,
        type:'top',
        name:'Dreamy Stage Top',
        emoji:'✨'
    },

    {
        id:3,
        type:'bottom',
        name:'Star Pleated Skirt',
        emoji:'🌸'
    },

    {
        id:4,
        type:'bottom',
        name:'Candy Mini Skirt',
        emoji:'🍬'
    },

    {
        id:5,
        type:'shoes',
        name:'Crystal Pumps',
        emoji:'👠'
    },

    {
        id:6,
        type:'shoes',
        name:'Ribbon Shoes',
        emoji:'🎀'
    },

    {
        id:7,
        type:'accessory',
        name:'Ribbon',
        emoji:'🎀'
    },

    {
        id:8,
        type:'accessory',
        name:'Tiara',
        emoji:'👑'
    },

    {
        id:9,
        type:'accessory',
        name:'Flower',
        emoji:'🌸'
    },

    {
        id:10,
        type:'accessory',
        name:'선택 안 함',
        emoji:'♡'
    }

];


function openCards(){

    showScreen('cardScreen');

    renderCards('all');

}


function filterCards(type,button){

    document.querySelectorAll('.categoryBtn')
        .forEach(x=>x.classList.remove('active'));

    button.classList.add('active');

    renderCards(type);

}


function renderCards(type){

    const grid=
        document.getElementById('cardGrid');

    grid.innerHTML='';

    cards
        .filter(card =>
            type==='all' || card.type===type
        )
        .forEach(card=>{

            const div=
                document.createElement('div');

            div.className='fashionCard';

            if(selectedCards[card.type]?.id===card.id){
                div.classList.add('selected');
            }

            div.innerHTML=`

                <div class="cardVisual">
                    ${card.emoji}
                </div>

                <div class="cardName">
                    ${card.name}
                </div>

                <div class="cardType">
                    ${card.type.toUpperCase()}
                </div>

            `;

            div.onclick=()=>{

                selectedCards[card.type]=card;

                renderCards(type);

            };

            grid.appendChild(div);

        });

}


/* =========================
MACHINE
========================= */

function openMachine(){

    const missing =
        Object.keys(selectedCards)
        .filter(type=>selectedCards[type]===null);

    if(missing.length){

        alert(
            'TOP / BOTTOM / SHOES / ACCESSORY를 모두 골라주세요.'
        );

        return;

    }

    showScreen('machineScreen');

    renderMachine();

}


function renderMachine(){

    const deck=
        document.getElementById('selectedDeck');

    deck.innerHTML='';

    Object.entries(selectedCards)
        .forEach(([type,card])=>{

            const div=
                document.createElement('div');

            div.className='selectedCard';

            div.dataset.type=type;

            div.innerHTML=`

                <div style="
                    font-size:42px;
                    text-align:center;
                    padding:12px;
                ">
                    ${card.emoji}
                </div>

                <div style="
                    font-weight:900;
                    color:#74587d;
                ">
                    ${card.name}
                </div>

                <div style="
                    font-size:10px;
                    color:#ad91b7;
                ">
                    ${type.toUpperCase()}
                </div>

            `;

            addDrag(div);

            deck.appendChild(div);

        });

}


/* =========================
DRAG
========================= */

let dragging=null;
let offsetX=0;
let offsetY=0;

function addDrag(el){

    el.addEventListener(
        'pointerdown',
        startDrag
    );

}


function startDrag(e){

    dragging=this;

    const rect=
        dragging.getBoundingClientRect();

    offsetX=e.clientX-rect.left;
    offsetY=e.clientY-rect.top;

    dragging.setPointerCapture(e.pointerId);

    dragging.classList.add('dragging');

    dragging.style.left=
        (e.clientX-offsetX)+'px';

    dragging.style.top=
        (e.clientY-offsetY)+'px';

    dragging.addEventListener(
        'pointermove',
        moveDrag
    );

    dragging.addEventListener(
        'pointerup',
        endDrag,
        {once:true}
    );

}


function moveDrag(e){

    if(!dragging)return;

    dragging.style.left=
        (e.clientX-offsetX)+'px';

    dragging.style.top=
        (e.clientY-offsetY)+'px';

}


function endDrag(e){

    if(!dragging)return;

    const type=
        dragging.dataset.type;

    const target=
        document.elementFromPoint(
            e.clientX,
            e.clientY
        )?.closest('.slot');

    if(
        target &&
        target.dataset.type===type
    ){

        target.classList.add('filled');

        target.innerHTML=
            selectedCards[type].name;

        dragging.remove();

    }

    else{

        dragging.classList.remove('dragging');

        dragging.style.position='';
        dragging.style.left='';
        dragging.style.top='';

    }

    dragging=null;

    checkMachine();

}


function checkMachine(){

    const filled=
        document.querySelectorAll(
            '.slot.filled'
        ).length;

    document.getElementById(
        'transformButton'
    ).disabled =
        filled!==4;

}


/* =========================
TRANSFORM
========================= */

function transform(){

    const overlay=
        document.getElementById(
            'transformOverlay'
        );

    overlay.classList.add('show');

    setTimeout(()=>{

        overlay.classList.remove('show');

        alert(
            '✨ 변신 완료! ✨'
        );

    },2500);

}

</script>
